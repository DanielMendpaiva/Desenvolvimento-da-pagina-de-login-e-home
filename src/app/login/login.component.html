<main class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <img src="./assets/img/logo.png" alt="Logo" class="login-logo">
      <h2>Entrar</h2>
      <p class="subtitle">Acesse sua conta para continuar</p>
    </div>

    <form (ngSubmit)="fazerLogin()" #loginForm="ngForm" class="login-form">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>E-mail ou Usuário</mat-label>
        <input matInput type="text" [(ngModel)]="usuario" name="usuario" placeholder="usuario@email.com" required>
        <mat-icon matPrefix class="form-icon">person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Senha</mat-label>
        <input matInput type="password" [(ngModel)]="senha" name="senha" placeholder="Digite sua senha" required>
        <mat-icon matPrefix class="form-icon">lock</mat-icon>
      </mat-form-field>

      <div class="login-actions">
        <button mat-raised-button color="primary" type="submit" class="btn-submit">
          Entrar
        </button>
      </div>

      <div class="login-footer">
        <a routerLink="/inicio" class="back-link">← Voltar para o início</a>
      </div>
    </form>
  </div>
</main>
