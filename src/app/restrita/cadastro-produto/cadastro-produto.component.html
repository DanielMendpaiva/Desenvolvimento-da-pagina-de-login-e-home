<div class="cadastro-container">
  <div class="cadastro-card">
    <div class="header-section">
      <div class="icon-circle">
        <mat-icon>sports_esports</mat-icon>
      </div>
      <h2>Cadastrar Novo Produto</h2>
      <p class="subtitle">Insira as informações do jogo para adicionar à API e ao catálogo</p>
    </div>

    <form (ngSubmit)="cadastrar()" #formCad="ngForm" class="cadastro-form">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nome do Produto</mat-label>
        <input matInput type="text" [(ngModel)]="produto.produto" name="produto" placeholder="Ex.: The Witcher 3" required>
        <mat-icon matPrefix>label</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Descrição do Jogo</mat-label>
        <textarea matInput [(ngModel)]="produto.descricao" name="descricao" rows="3" placeholder="Breve resumo sobre o enredo e gênero do jogo..." required></textarea>
        <mat-icon matPrefix>description</mat-icon>
      </mat-form-field>

      <div class="row g-3">
        <div class="col-md-7">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Caminho ou URL da Imagem (Foto)</mat-label>
            <input matInput type="text" [(ngModel)]="produto.foto" name="foto" placeholder="./assets/img/jogo1.PNG" required>
            <mat-icon matPrefix>image</mat-icon>
          </mat-form-field>
        </div>

        <div class="col-md-5">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Preço (R$)</mat-label>
            <input matInput type="number" step="0.01" [(ngModel)]="produto.preco" name="preco" placeholder="199.90" required>
            <span matPrefix class="prefix-money">R$&nbsp;</span>
          </mat-form-field>
        </div>
      </div>

      <div class="preview-box" *ngIf="produto.foto">
        <p class="preview-label">Prévia da Capa:</p>
        <img [src]="produto.foto" alt="Prévia" class="preview-img" onerror="this.src='./assets/img/jogo1.PNG'">
      </div>

      <div class="actions-section">
        <button mat-stroked-button type="button" routerLink="/restrita/lista" class="btn-cancelar">
          Cancelar
        </button>
        <button mat-raised-button color="primary" type="submit" class="btn-salvar">
          <mat-icon>save</mat-icon> Salvar Produto na API
        </button>
      </div>
    </form>
  </div>
</div>
